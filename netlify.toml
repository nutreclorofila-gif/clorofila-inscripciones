# Sitio CONGELADO: la página NO se vuelve a publicar acá, porque cada publicación
# gasta créditos de Netlify. La que usa el teléfono vive en GitHub Pages (rama
# gh-pages, con local/publicar-pagina.sh). Este archivo y el sitio se conservan a
# pedido de Leo: no se borran.
[build]
  publish = "web"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
