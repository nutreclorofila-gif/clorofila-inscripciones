<!DOCTYPE html>
<html lang="es">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Clorofila — Inscripciones</title>
  </head>
  <body>
<!-- Clorofila — Inscripciones. Pantalla única, pensada para el celu. -->
<style>
  :root {
    --crema: #F5F0E8;
    --verde: #2D4A3E;
    --verde-claro: #5C7A67;
    --dorado: #A98F5C;
    --linea: #E2DBCB;
    --fondo: #FAFAF7;
    --papel: #FFFFFF;
    --texto: #23281F;
    --tenue: #7A7A70;
    --rojo: #B03A32;
    --ambar: #9A6B1E;
    --ambar-fondo: #FDF4E0;
    --rojo-fondo: #FBEBE9;
    --verde-fondo: #EAF0EC;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --crema: #22271F; --verde: #A8C9B4; --verde-claro: #7FA98C;
      --dorado: #C7AC77; --linea: #343A30; --fondo: #141713; --papel: #1B1F19;
      --texto: #E9E7DE; --tenue: #9A9B90; --rojo: #E9897F; --ambar: #DCB463;
      --ambar-fondo: #2C2517; --rojo-fondo: #2E1C19; --verde-fondo: #1F2A22;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--fondo); color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; line-height: 1.45;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 0 14px 40px; }

  /* --- encabezado --- */
  header {
    position: sticky; top: 0; z-index: 10; background: var(--fondo);
    padding: 14px 0 8px; border-bottom: 1px solid var(--linea);
  }
  .tituloFila { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  h1 { margin: 0; font-size: 19px; letter-spacing: -0.01em; font-weight: 700; }
  .sello { font-size: 12px; color: var(--tenue); }
  .refrescar {
    border: 1px solid var(--linea); background: var(--papel); color: var(--texto);
    border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .refrescar:active { transform: scale(0.97); }
  /* El hueco es grande a propósito: Actualizar se toca todo el tiempo y Salir
     borra los datos del teléfono. Con 8px se tocaba uno por el otro. */
  .botonesCabecera { display: flex; align-items: center; gap: 16px; flex: 0 0 auto; }
  /* Salir se usa una vez cada tanto: que no le pelee el lugar a Actualizar. */
  .salir {
    border: none; background: none; color: var(--apagado); font: inherit; font-size: 13px;
    padding: 10px 4px; min-width: 44px; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .salir:active { opacity: 0.6; }
  .refrescar[disabled] { opacity: 0.5; }

  /* --- tira de totales --- */
  .totales { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 4px; }
  .total { background: var(--crema); border-radius: 14px; padding: 10px 8px; text-align: center; }
  .total .n { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .total .n.chico { font-size: 19px; }
  .total .r { font-size: 11px; color: var(--tenue); text-transform: uppercase; letter-spacing: 0.04em; }

  /* --- solapas --- */
  nav { display: flex; gap: 6px; margin: 12px 0 16px; overflow-x: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  .solapa {
    flex: 0 0 auto; border: none; background: var(--crema); color: var(--texto);
    border-radius: 999px; padding: 9px 15px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .solapa[aria-selected="true"] { background: var(--verde); color: var(--fondo); font-weight: 600; }
  .globo {
    display: inline-block; min-width: 19px; margin-left: 6px; padding: 0 5px;
    border-radius: 999px; background: var(--rojo); color: #fff;
    font-size: 11px; font-weight: 700; line-height: 19px; text-align: center;
  }
  .solapa[aria-selected="true"] .globo { background: var(--fondo); color: var(--verde); }

  /* --- tarjeta de edición --- */
  .tarjeta {
    background: var(--papel); border: 1px solid var(--linea); border-radius: 16px;
    margin-bottom: 12px; overflow: hidden;
  }
  .tarjeta.llena { border-color: var(--verde-claro); }
  .cabeza { display: block; width: 100%; text-align: left; background: none; border: none;
            color: inherit; font: inherit; padding: 14px; cursor: pointer; }
  .quees { font-size: 12px; color: var(--tenue); text-transform: uppercase; letter-spacing: 0.05em; }
  .cual { font-size: 16px; font-weight: 600; margin-top: 1px; }
  .cifra { display: flex; align-items: baseline; gap: 10px; margin-top: 8px; }
  .grande { font-size: 44px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .de { font-size: 20px; color: var(--tenue); font-variant-numeric: tabular-nums; }
  .quedan { margin-left: auto; font-size: 13px; text-align: right; color: var(--tenue); }
  .quedan b { display: block; font-size: 17px; color: var(--texto); }
  .barra { height: 7px; border-radius: 999px; background: var(--crema); margin-top: 11px; overflow: hidden; }
  .barra i { display: block; height: 100%; border-radius: 999px; background: var(--verde-claro); }
  .barra i.alta { background: var(--dorado); }
  .barra i.full { background: var(--verde); }
  .pie { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: var(--tenue); }
  .pie b { color: var(--texto); font-variant-numeric: tabular-nums; }
  .detalle { border-top: 1px solid var(--linea); padding: 4px 14px 12px; background: var(--crema); }

  /* --- persona --- */
  .persona { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--linea); }
  .persona:last-child { border-bottom: none; }
  .persona .quien { min-width: 0; flex: 1; }
  .persona .nom { font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .persona .sub { font-size: 12px; color: var(--tenue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { flex: 0 0 auto; font-size: 11.5px; font-weight: 600; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
  .chip.completo { background: var(--verde-fondo); color: var(--verde); }
  .chip.cubierto { background: var(--crema); color: var(--tenue); }
  .chip.parcial  { background: var(--ambar-fondo); color: var(--ambar); }
  .chip.sin_pago, .chip.revisar { background: var(--rojo-fondo); color: var(--rojo); }

  /* --- avisos --- */
  .aviso { border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; border: 1px solid transparent; }
  .aviso.alta  { background: var(--rojo-fondo); border-color: var(--rojo); }
  .aviso.media { background: var(--ambar-fondo); border-color: var(--linea); }
  .aviso.info  { background: var(--verde-fondo); border-color: var(--linea); }
  .aviso .q { font-size: 15px; font-weight: 600; }
  .aviso.nuevo { border-color: var(--verde); }
  .aviso .p { font-size: 13px; color: var(--tenue); margin-top: 3px; }

  .seccion { margin: 24px 0 10px; font-size: 12px; color: var(--tenue);
             text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; }
  details > summary { cursor: pointer; list-style: none; color: var(--tenue); font-size: 14px; padding: 10px 0; }
  details > summary::-webkit-details-marker { display: none; }
  .vacio { color: var(--tenue); font-size: 15px; padding: 26px 4px; text-align: center; }
  .buscador {
    width: 100%; font: inherit; font-size: 16px; padding: 11px 14px; margin-bottom: 12px;
    border: 1px solid var(--linea); border-radius: 12px; background: var(--papel); color: var(--texto);
  }
  .oculto { display: none !important; }

  .persona { cursor: pointer; }
  .contacto { display: flex; gap: 8px; padding: 2px 0 10px; flex-wrap: wrap; }
  .contacto a, .contacto button {
    flex: 1 1 auto; min-width: 116px; text-align: center; text-decoration: none;
    font: inherit; font-size: 13px; font-weight: 600; padding: 9px 12px;
    border-radius: 10px; border: 1px solid var(--linea);
    background: var(--papel); color: var(--verde); cursor: pointer;
  }
  .contacto .apagado { color: var(--tenue); border-style: dashed; }
  .cuando { font-size: 12px; color: var(--tenue); font-weight: 600; }
  .cuando.ya { color: var(--rojo); }
  .cuando.pronto { color: var(--ambar); }
  .copiar {
    width: 100%; margin-top: 8px; padding: 10px; border-radius: 10px;
    border: 1px solid var(--linea); background: var(--papel); color: var(--texto);
    font: inherit; font-size: 13px; cursor: pointer;
  }
  .veces {
    display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 999px;
    background: var(--crema); color: var(--dorado); font-size: 11px; font-weight: 700;
    vertical-align: middle;
  }
  .espera-chip { background: var(--crema); color: var(--tenue); }
  .viejo {
    background: var(--ambar-fondo); color: var(--ambar); border-radius: 10px;
    padding: 9px 12px; font-size: 13px; margin-bottom: 10px;
  }

  .puerta { padding: 56px 4px 24px; text-align: center; }
  .puerta h2 { margin: 0 0 6px; font-size: 20px; }
  .puerta p { margin: 0 0 22px; color: var(--tenue); font-size: 14px; }
  .puerta input {
    width: 100%; max-width: 240px; text-align: center; font: inherit;
    font-size: 30px; letter-spacing: 0.32em; padding: 12px 10px;
    border: 1px solid var(--linea); border-radius: 14px;
    background: var(--papel); color: var(--texto); font-variant-numeric: tabular-nums;
  }
  .puerta button {
    display: block; width: 100%; max-width: 240px; margin: 12px auto 0;
    padding: 13px; border: none; border-radius: 12px;
    background: var(--verde); color: var(--fondo); font: inherit; font-size: 16px; font-weight: 600;
  }
  .puerta button[disabled] { opacity: 0.5; }
  .puerta .mal { color: var(--rojo); font-size: 14px; margin-top: 14px; min-height: 20px; }
  .error { background: var(--rojo-fondo); color: var(--rojo); border-radius: 12px; padding: 12px 14px; margin: 12px 0; font-size: 14px; }
</style>

<div class="wrap">
  <header>
    <div class="tituloFila">
      <h1>Inscripciones</h1>
      <div class="botonesCabecera">
        <button class="refrescar" id="btnRefrescar" type="button">Actualizar</button>
        <button class="salir oculto" id="btnSalir" type="button">Salir</button>
      </div>
    </div>
    <div class="sello" id="sello"></div>
  </header>

  <div id="error" class="error oculto"></div>
  <div class="totales" id="totales"></div>
  <nav id="solapas" role="tablist"></nav>
  <main id="panel"></main>
</div>

<script>
  // Apunta al Apps Script que lee la planilla. El PIN es lo que protege los datos.
  var URL_API = "https://script.google.com/macros/s/AKfycbzLD9WH9fQN7_yVuSzC1KtQ1PRabYKK5YBEKUkOmssRDLsV0SfRq-kM5HxgNYN6_FpT/exec";
  var DATOS = null;
  var SOLAPA = 'cupos';
  var ABIERTAS = {};
  var CLAVE_PIN = 'clorofila_pin';
  var CLAVE_CACHE = 'clorofila_ultimo';
  var DESDE_CACHE = false;
  var PIN_ACTUAL = '';
  var NOVEDADES = null;

  /** Después de esto, lo guardado no se muestra más y hay que buscar de nuevo. */
  var VIDA_CACHE = 3 * 24 * 60 * 60 * 1000;   // 3 días

  /**
   * Guarda el último estado en el teléfono para poder abrir la app sin señal
   * (en el local, en la calle).
   *
   * Qué protege y qué no, sin vueltas: esto queda escrito en el teléfono en
   * texto plano, con los nombres, mails y celulares. La puerta de la app es el
   * PIN, pero lo guardado NO está cifrado: quien tenga el teléfono desbloqueado
   * y sepa mirar el almacenamiento del navegador lo lee. Por eso vence a los
   * tres días y por eso está el botón "Salir", que lo borra.
   */
  function guardarCache(estado, pin) {
    try {
      localStorage.setItem(CLAVE_CACHE, JSON.stringify({ pin: pin, estado: estado, cuando: Date.now() }));
    } catch (e) {}
  }
  function leerCache(pin) {
    try {
      var c = JSON.parse(localStorage.getItem(CLAVE_CACHE) || 'null');
      if (!c || !c.estado || c.pin !== pin) return null;
      // Vencida: mostrar plata y cupos de hace una semana es peor que no mostrar nada.
      if (!c.cuando || (Date.now() - c.cuando) > VIDA_CACHE) { borrarCache(); return null; }
      return c;
    } catch (e) { return null; }
  }
  function borrarCache() {
    try { localStorage.removeItem(CLAVE_CACHE); } catch (e) {}
  }

  /**
   * Qué cambió desde la última vez. La app se abre varias veces por día y lo
   * primero que uno quiere saber es si se anotó alguien.
   *
   * Se compara por mail (o por nombre si no hay), NO por número de fila:
   * insertar una fila arriba correría todas las demás y la app diría que se
   * anotaron doce personas de golpe.
   */
  function quienesEstan(estado) {
    var mapa = {};
    ((estado && estado.ediciones) || []).forEach(function (e) {
      (e.personas || []).forEach(function (p) {
        var quien = String(p.email || p.nombre || '').trim().toLowerCase();
        if (quien) mapa[e.edicion + '|' + quien] = { nombre: p.nombre, edicion: e.edicion, vigente: e.vigente };
      });
    });
    return mapa;
  }

  function compararEstados(antes, ahora) {
    if (!antes) return null;
    var viejos = quienesEstan(antes), nuevos = quienesEstan(ahora);
    var aparecidos = Object.keys(nuevos)
      .filter(function (k) { return !viejos[k] && nuevos[k].vigente; })
      .map(function (k) { return nuevos[k]; });
    return aparecidos.length ? aparecidos : null;
  }

  /** Un estado recién traído del servidor: compara, guarda y pinta. */
  function recibirEstado(estado, pin) {
    var antes = leerCache(pin);
    NOVEDADES = antes ? { gente: compararEstados(antes.estado, estado), desde: antes.cuando } : null;
    if (NOVEDADES && !NOVEDADES.gente) NOVEDADES = null;
    guardarCache(estado, pin);
    DATOS = estado;
    DESDE_CACHE = false;
  }

  function pinGuardado() {
    if (PIN_ACTUAL) return PIN_ACTUAL;
    try { return localStorage.getItem(CLAVE_PIN) || ''; } catch (e) { return ''; }
  }
  function guardarPin(p) {
    PIN_ACTUAL = p;
    try { localStorage.setItem(CLAVE_PIN, p); } catch (e) {}
  }
  function olvidarPin() {
    PIN_ACTUAL = '';
    try { localStorage.removeItem(CLAVE_PIN); } catch (e) {}
  }
  /** Deja el teléfono como si nunca se hubiera entrado. */
  function olvidarTodo() {
    olvidarPin();
    borrarCache();
    DATOS = null;
    DESDE_CACHE = false;
    NOVEDADES = null;
  }

  /**
   * Trae los datos del servidor mandando el PIN.
   *
   * La misma página funciona en los dos lugares donde vive:
   *  - servida por Apps Script  -> habla por google.script.run
   *  - servida como página suelta (GitHub Pages) -> habla por fetch contra la API
   * La segunda existe porque abrir la app en script.google.com falla en
   * navegadores con varias cuentas de Google: Google reescribe la URL con /u/N/
   * y esa forma no resuelve. Desde otro dominio, con credentials:'omit', no hay
   * cookies de sesión y el problema desaparece.
   */
  var API = (typeof URL_API !== 'undefined') ? URL_API : null;

  function pedirDatos(pin, alLograrlo, alFallar) {
    if (!API && window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(alLograrlo).withFailureHandler(alFallar).obtenerEstado(pin);
      return;
    }
    fetch(API + '?formato=json&pin=' + encodeURIComponent(pin), { credentials: 'omit' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.ok) alLograrlo(d.estado);
        else alFallar(new Error((d && d.error) || 'No se pudo leer la planilla.'));
      })
      .catch(function (e) {
        alFallar(new Error('Sin conexión con la planilla. ' + (e.message || '')));
      });
  }

  function mostrarPuerta(mensaje) {
    document.getElementById('totales').classList.add('oculto');
    document.getElementById('solapas').classList.add('oculto');
    document.getElementById('sello').textContent = '';
    document.getElementById('btnRefrescar').classList.add('oculto');
    document.getElementById('btnSalir').classList.add('oculto');
    document.getElementById('panel').innerHTML =
      '<div class="puerta">' +
        '<h2>Inscripciones</h2>' +
        '<p>Escribí el PIN para ver los números.</p>' +
        '<input id="pin" type="tel" inputmode="numeric" maxlength="6" autocomplete="off" ' +
          'pattern="[0-9]*" placeholder="······">' +
        '<button id="entrar" type="button">Entrar</button>' +
        '<div class="mal" id="malPin">' + esc(mensaje || '') + '</div>' +
      '</div>';

    var campo = document.getElementById('pin');
    var boton = document.getElementById('entrar');
    var aviso = document.getElementById('malPin');

    function intentar() {
      var pin = campo.value.trim();
      if (!pin) { campo.focus(); return; }
      boton.disabled = true;
      boton.textContent = 'Entrando…';
      aviso.textContent = '';
      pedirDatos(pin, function (estado) {
        guardarPin(pin);
        recibirEstado(estado, pin);
        abrirApp();
      }, function (e) {
        var mensaje = (e && e.message) ? e.message : 'No se pudo entrar.';
        // Sin señal: si el PIN es el mismo con que se guardó, se muestra lo último.
        var c = /PIN/i.test(mensaje) ? null : leerCache(pin);
        if (c) {
          guardarPin(pin);
          DATOS = c.estado;
          DESDE_CACHE = c.cuando;
          abrirApp();
          return;
        }
        boton.disabled = false;
        boton.textContent = 'Entrar';
        aviso.textContent = mensaje;
        campo.value = '';
        campo.focus();
      });
    }

    boton.addEventListener('click', intentar);
    campo.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') intentar(); });
    campo.focus();
  }

  function abrirApp() {
    document.getElementById('totales').classList.remove('oculto');
    document.getElementById('solapas').classList.remove('oculto');
    document.getElementById('btnRefrescar').classList.remove('oculto');
    document.getElementById('btnSalir').classList.remove('oculto');
    pintarTodo();
  }

  function arrancar() {
    if (DATOS) { abrirApp(); return; }
    var pin = pinGuardado();
    if (!pin) { mostrarPuerta(''); return; }
    // Ya entró antes en este teléfono: no le pedimos el PIN de nuevo.
    document.getElementById('panel').innerHTML = '<div class="vacio">Buscando los números…</div>';
    pedirDatos(pin, function (estado) {
      recibirEstado(estado, pin);
      abrirApp();
    }, function (e) {
      var mensaje = (e && e.message) ? e.message : '';
      var c = /PIN/i.test(mensaje) ? null : leerCache(pin);
      if (c) { DATOS = c.estado; DESDE_CACHE = c.cuando; abrirApp(); return; }
      olvidarPin();
      mostrarPuerta('Volvé a escribir el PIN.');
    });
  }

  /* ---------- helpers ---------- */
  function esc(t) {
    return String(t === null || t === undefined ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  /**
   * Texto comparable para buscar: sin acentos y en minúsculas. Acá los nombres
   * llevan tildes y ñ, y nadie las escribe al buscar en el celular: sin esto,
   * "sofia" no encuentra a "Sofía" y "nunez" no encuentra a "Núñez".
   */
  function sinAcentos(t) {
    return String(t === null || t === undefined ? '' : t).toLowerCase()
      .replace(/[áàäâã]/g, 'a').replace(/[éèëê]/g, 'e').replace(/[íìïî]/g, 'i')
      .replace(/[óòöôõ]/g, 'o').replace(/[úùüû]/g, 'u').replace(/ñ/g, 'n').replace(/ç/g, 'c');
  }

  /**
   * ¿Esta persona coincide con lo que se escribió? Cada palabra por separado,
   * así "gomez sofia" encuentra a "Sofía Gómez" igual que "sofia gomez".
   * Si lo buscado son solo números, se compara también contra el celular sin
   * espacios ni guiones, que es como se copia y pega de WhatsApp.
   */
  function coincideBusqueda(texto, celular, q) {
    var busqueda = String(q || '').trim();
    var digitos = String(celular || '').replace(/\D/g, '');

    // Si lo buscado son puros números, es un celular: se compara entero y sin
    // el país, que es como viene cuando se copia y pega de WhatsApp
    // ("+598 99 817 677" tiene que encontrar al que está cargado "099817677").
    if (/^[\d\s+().-]+$/.test(busqueda) && /\d/.test(busqueda)) {
      var a = nucleoTelefono(busqueda), b = nucleoTelefono(digitos);
      return !!a && !!b && (b.indexOf(a) !== -1 || a.indexOf(b) !== -1);
    }

    var pajar = sinAcentos(texto);
    return sinAcentos(busqueda).split(/\s+/).filter(Boolean).every(function (palabra) {
      if (pajar.indexOf(palabra) !== -1) return true;
      var soloNumeros = palabra.replace(/\D/g, '');
      return soloNumeros.length >= 3 && digitos.indexOf(soloNumeros) !== -1;
    });
  }

  /** Un celular uruguayo sin el país ni el cero de adelante: "598099..." -> "99...". */
  function nucleoTelefono(texto) {
    var d = String(texto || '').replace(/\D/g, '');
    if (d.indexOf('598') === 0 && d.length > 8) d = d.slice(3);
    return d.replace(/^0+/, '');
  }

  function plata(n) {
    var v = Math.round(Number(n) || 0);
    return (v < 0 ? '-' : '') + '$ ' + String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }
  function hora(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var dd = function (x) { return (x < 10 ? '0' : '') + x; };
    return dd(d.getDate()) + '/' + dd(d.getMonth() + 1) + ' ' + dd(d.getHours()) + ':' + dd(d.getMinutes());
  }
  /** "hoy", "mañana", "en 9 días" — para saber qué es lo más urgente sin pensar. */
  function cuandoEs(iso) {
    if (!iso) return null;
    var f = new Date(iso);
    if (isNaN(f)) return null;
    var hoy = new Date();
    var dias = Math.round(
      (new Date(f.getFullYear(), f.getMonth(), f.getDate()) -
       new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate())) / 86400000);
    if (dias < 0) return { texto: 'ya pasó', clase: 'ya', dias: dias };
    if (dias === 0) return { texto: 'ES HOY', clase: 'ya', dias: 0 };
    if (dias === 1) return { texto: 'es mañana', clase: 'pronto', dias: 1 };
    if (dias <= 7) return { texto: 'en ' + dias + ' días', clase: 'pronto', dias: dias };
    return { texto: 'en ' + dias + ' días', clase: '', dias: dias };
  }

  /** Botones para escribirle a alguien. Sin dato, no se ofrece el botón. */
  function contacto(p) {
    var partes = [];
    if (p.whatsapp) {
      partes.push('<a href="https://wa.me/' + esc(p.whatsapp) + '" target="_blank" rel="noopener">WhatsApp</a>');
    } else if (p.celular) {
      partes.push('<a href="tel:' + esc(p.celular) + '">' + esc(p.celular) + '</a>');
    }
    if (p.email) {
      partes.push('<a href="mailto:' + esc(p.email) + '">Mail</a>');
    }
    if (!partes.length) partes.push('<span class="apagado" style="padding:9px 12px">Sin contacto cargado</span>');
    if (p.email) {
      partes.push('<span class="apagado" style="flex:1 1 100%;padding:6px 2px;text-align:left;border:none;background:none;font-weight:400">' + esc(p.email) + '</span>');
    }
    return '<div class="contacto">' + partes.join('') + '</div>';
  }

  /** Una persona de la lista de espera, con su contacto a un toque. */
  function enEspera(x, clave) {
    return '<div class="persona" data-quien="' + esc(clave) + '"><div class="quien">' +
      '<div class="nom">' + esc(x.nombre || '(sin nombre)') + '</div>' +
      '<div class="sub">' + esc(x.quiere || 'sin edición anotada') + '</div></div>' +
      '<span class="chip espera-chip">Espera</span></div>' +
      (CONTACTOS[clave] ? contacto(x) : '');
  }

  var ETIQUETAS = {
    completo: 'Pagó', parcial: 'Debe', cubierto: 'Cubierto',
    sin_pago: 'Sin pago', revisar: 'Revisar'
  };

  /* ---------- render ---------- */
  function pintarTodo() {
    document.getElementById('sello').textContent =
      'Datos de la planilla · ' + hora(DATOS.generadoEn);
    pintarTotales();
    pintarSolapas();
    pintarPanel();
  }

  function pintarTotales() {
    var r = DATOS.resumen;
    // La plata NO va acá. Esta barra se ve apenas se abre la app, y la app se
    // abre en el local, en la calle, con gente al lado. Lo cobrado vive en la
    // solapa Plata, a un toque de distancia.
    document.getElementById('totales').innerHTML =
      caja(r.anotados + '<span style="font-size:.55em;color:var(--tenue)">/' + r.cupo + '</span>', 'anotados') +
      caja(r.libres, 'lugares libres') +
      caja(r.pendientes, r.pendientes === 1 ? 'pago pendiente' : 'pagos pendientes');
  }
  function caja(n, rotulo, chico) {
    return '<div class="total"><div class="n' + (chico ? ' chico' : '') + '">' + n +
           '</div><div class="r">' + rotulo + '</div></div>';
  }

  function pintarSolapas() {
    var altas = DATOS.resumen.alertasAltas;
    var total = DATOS.resumen.alertasTotal;
    var defs = [
      ['cupos', 'Cupos', 0],
      ['plata', 'Plata', 0],
      ['gente', 'Gente', 0],
      ['alertas', 'Alertas', total]
    ];
    document.getElementById('solapas').innerHTML = defs.map(function (d) {
      return '<button class="solapa" role="tab" data-solapa="' + d[0] + '" aria-selected="' +
        (SOLAPA === d[0]) + '">' + d[1] +
        (d[2] ? '<span class="globo"' + (altas ? '' : ' style="background:var(--dorado)"') + '>' + d[2] + '</span>' : '') +
        '</button>';
    }).join('');
  }

  /**
   * "Se anotaron 2 desde ayer". Sin montos: esto se ve en la portada.
   * Aparece solo cuando hay gente nueva; si no cambió nada, no se muestra nada.
   */
  function avisoDeNovedades() {
    if (!NOVEDADES || !NOVEDADES.gente || !NOVEDADES.gente.length) return '';
    var g = NOVEDADES.gente;
    var min = Math.round((Date.now() - NOVEDADES.desde) / 60000);
    var desde = min < 60 ? 'en la última hora'
              : (min < 1440 ? ('desde hace ' + Math.round(min / 60) + ' h')
              : ('desde hace ' + Math.round(min / 1440) + (Math.round(min / 1440) === 1 ? ' día' : ' días')));
    var quienes = g.slice(0, 3).map(function (x) { return esc(x.nombre || 'alguien'); }).join(', ');
    if (g.length > 3) quienes += ' y ' + (g.length - 3) + ' más';
    return '<div class="aviso info nuevo"><div class="q">' +
      (g.length === 1 ? 'Se anotó 1 persona ' : 'Se anotaron ' + g.length + ' personas ') + desde +
      '</div><div class="p">' + quienes + '</div></div>';
  }

  function avisoDeCache() {
    if (!DESDE_CACHE) return '';
    var min = Math.round((Date.now() - DESDE_CACHE) / 60000);
    var hace = min < 60 ? ('hace ' + (min || 1) + ' min')
             : (min < 1440 ? ('hace ' + Math.round(min / 60) + ' h')
             : ('hace ' + Math.round(min / 1440) + ' días'));
    return '<div class="viejo">Sin conexión. Esto es lo último que se pudo leer, ' + hace +
           '. Tocá Actualizar cuando tengas señal.</div>';
  }

  function pintarPanel() {
    var p = document.getElementById('panel');
    if (SOLAPA === 'cupos') p.innerHTML = avisoDeCache() + avisoDeNovedades() + vistaCupos();
    else if (SOLAPA === 'plata') p.innerHTML = avisoDeCache() + vistaPlata();
    else if (SOLAPA === 'gente') {
      p.innerHTML = '<input class="buscador" id="buscador" type="search" autocomplete="off" ' +
        'placeholder="Buscar por nombre, mail o celular"><div id="listaGente"></div>';
      var b = document.getElementById('buscador');
      var lista = document.getElementById('listaGente');
      lista.innerHTML = vistaGente('');
      b.addEventListener('input', function () { lista.innerHTML = vistaGente(b.value); });
    }
    else p.innerHTML = vistaAlertas();
  }

  /* ---------- cupos ---------- */
  function vistaCupos() {
    // Lo más próximo primero: es lo que hay que mirar hoy.
    var vigentes = DATOS.ediciones.filter(function (e) { return e.vigente; })
      .sort(function (a, b) {
        if (!a.fecha) return 1;
        if (!b.fecha) return -1;
        return new Date(a.fecha) - new Date(b.fecha);
      });
    var pasadas = DATOS.ediciones.filter(function (e) { return !e.vigente; });
    var html = '';

    var urgentes = DATOS.alertas.filter(function (a) { return a.nivel === 'alta'; });
    if (urgentes.length) html += urgentes.map(avisoSinPlata).join('');

    if (!vigentes.length) html += '<div class="vacio">No hay ninguna edición abierta ni por venir.</div>';
    else html += vigentes.map(tarjeta).join('');

    if (pasadas.length) {
      html += '<details><summary>Ver las ' + pasadas.length + ' ediciones que ya pasaron</summary>' +
        pasadas.map(tarjeta).join('') + '</details>';
    }
    if (DATOS.fueraDeCupo.length) {
      html += '<div class="seccion">No ocupan cupo</div>' +
        DATOS.fueraDeCupo.map(function (f) {
          return '<div class="persona"><div class="quien"><div class="nom">' + esc(f.nombre) +
            '</div><div class="sub">' + esc(f.edicion) + '</div></div></div>';
        }).join('');
    }
    return html;
  }

  function tarjeta(e) {
    var cuando = cuandoEs(e.fecha);
    var esperan = (DATOS.espera || []).filter(function (x) { return x.edicion === e.edicion; });
    var pct = Math.round(e.ocupacion * 100);
    var clase = pct >= 100 ? 'full' : (pct >= 70 ? 'alta' : '');
    var abierta = ABIERTAS[e.id];
    return '<div class="tarjeta' + (pct >= 100 ? ' llena' : '') + '">' +
      '<button class="cabeza" data-ed="' + e.id + '" aria-expanded="' + !!abierta + '">' +
        '<div class="quees">' + esc(e.titulo) + (e.abierta ? '' : ' · cerrada') +
          (cuando && e.vigente ? ' · <span class="cuando ' + cuando.clase + '">' + cuando.texto + '</span>' : '') +
        '</div>' +
        '<div class="cual">' + esc(e.subtitulo || e.edicion) + '</div>' +
        '<div class="cifra">' +
          '<span class="grande">' + e.anotados + '</span>' +
          '<span class="de">de ' + e.cupo + '</span>' +
          '<span class="quedan">' + (e.quedan > 0
            ? '<b>' + e.quedan + '</b>' + (e.quedan === 1 ? 'lugar libre' : 'lugares libres')
            : (e.quedan === 0 ? '<b>Lleno</b>' : '<b>' + Math.abs(e.quedan) + ' de más</b>')) +
          '</span>' +
        '</div>' +
        '<div class="barra"><i class="' + clase + '" style="width:' + Math.min(pct, 100) + '%"></i></div>' +
        '<div class="pie">' +
          (esperan.length
            ? '<span style="color:var(--dorado);font-weight:600">' + esperan.length +
              (esperan.length === 1 ? ' esperando lugar' : ' esperando lugar') + '</span>'
            : '') +
          // Sin montos: los importes de cada edición están en la solapa Plata.
          (e.pendientes.length ? '<span><b>' + e.pendientes.length + '</b> con el pago pendiente</span>' : '') +
          '<span style="margin-left:auto">' + (abierta ? 'ocultar ▴' : 'ver la gente ▾') + '</span>' +
        '</div>' +
      '</button>' +
      (abierta ? '<div class="detalle">' + (e.personas.length
        ? e.personas.map(function (p) { return persona(p); }).join('') +
          '<button class="copiar" data-copiar="' + e.id + '">Copiar la lista de anotados</button>'
        : '<div class="vacio">Todavía no se anotó nadie.</div>') +
        (esperan.length
          ? '<div class="seccion">Esperando lugar</div>' +
            esperan.map(function (x, i) { return enEspera(x, e.id + '-esp' + i); }).join('')
          : '') +
        '</div>' : '') +
    '</div>';
  }

  var CONTACTOS = {};

  function persona(p, id) {
    var etiqueta = ETIQUETAS[p.estadoPago] + (p.estadoPago === 'parcial' ? ' ' + plata(p.saldo) : '');
    var sub = [p.horario, p.medioPago, p.monto ? plata(p.monto) : ''].filter(Boolean).join(' · ');
    var clave = id || (p.hoja + '#' + p.fila);
    return '<div class="persona" data-quien="' + esc(clave) + '"><div class="quien">' +
      '<div class="nom">' + esc(p.nombre || '(sin nombre)') +
        (p.veces > 1 ? '<span class="veces" title="Ya vino ' + p.veces + ' veces">' + p.veces + 'ª vez</span>' : '') +
      '</div>' +
      '<div class="sub">' + esc(sub) + '</div></div>' +
      '<span class="chip ' + p.estadoPago + '">' + esc(etiqueta) + '</span></div>' +
      (CONTACTOS[clave] ? contacto(p) : '');
  }

  /* ---------- plata ---------- */
  function vistaPlata() {
    var vigentes = DATOS.ediciones.filter(function (e) { return e.vigente; });
    var r = DATOS.resumen;
    var t = DATOS.tikzet;
    var html =
      '<div class="tarjeta"><div style="padding:14px">' +
        '<div class="quees">Cobrado en lo que viene</div>' +
        '<div class="grande" style="margin-top:6px">' + plata(r.recaudado) + '</div>' +
        '<div class="pie">' +
          (r.saldo ? '<span>Falta cobrar <b>' + plata(r.saldo) + '</b></span>' : '<span>Sin saldos pendientes</span>') +
          '<span><b>' + r.pendientes + '</b> ' + (r.pendientes === 1 ? 'persona' : 'personas') + ' con algo pendiente</span>' +
        '</div>' +
      '</div></div>';

    html += '<div class="seccion">Por edición</div>';
    html += vigentes.map(function (e) {
      return '<div class="persona"><div class="quien">' +
        '<div class="nom">' + esc(e.subtitulo || e.edicion) + '</div>' +
        '<div class="sub">' + esc(e.titulo) + ' · ' + e.anotados + (e.anotados === 1 ? ' anotado' : ' anotados') +
          (e.saldo ? ' · falta ' + plata(e.saldo) : '') + '</div></div>' +
        '<span style="font-weight:700;font-variant-numeric:tabular-nums">' + plata(e.recaudado) + '</span></div>';
    }).join('') || '<div class="vacio">No hay ediciones vigentes.</div>';

    var pendientes = [];
    vigentes.forEach(function (e) {
      e.pendientes.forEach(function (p) { pendientes.push({ e: e, p: p }); });
    });
    html += '<div class="seccion">Falta que paguen</div>';
    html += pendientes.length
      ? pendientes.map(function (x) {
          return '<div class="persona"><div class="quien">' +
            '<div class="nom">' + esc(x.p.nombre) + '</div>' +
            '<div class="sub">' + esc(x.e.subtitulo || x.e.edicion) + ' · ' + esc(x.p.nota || '') + '</div></div>' +
            '<span class="chip ' + x.p.estadoPago + '">' +
              ETIQUETAS[x.p.estadoPago] + (x.p.saldo ? ' ' + plata(x.p.saldo) : '') + '</span></div>';
        }).join('')
      : '<div class="vacio">Está todo cobrado.</div>';

    // Gift cards: las vendidas sin usar son plata ya cobrada y un lugar futuro.
    var gc = DATOS.giftCards || [];
    var sinUsar = gc.filter(function (g) { return !g.usada; });
    if (gc.length) {
      html += '<div class="seccion">Gift cards</div>' +
        '<div class="tarjeta"><div style="padding:14px">' +
          '<div class="cifra"><span class="grande">' + sinUsar.length + '</span>' +
          '<span class="de">sin usar</span>' +
          // Si en la planilla no hay columna de importe, no se inventa un $0:
          // mostrar cero como si fuera un dato medido es peor que no mostrarlo.
          (r.giftSinMonto ? ''
            : '<span class="quedan"><b>' +
              plata(sinUsar.reduce(function (a, g) { return a + (g.monto || 0); }, 0)) +
              '</b>cobrado por adelantado</span>') +
          '</div>' +
          '<div class="pie"><span>' + gc.length + ' vendidas en total</span>' +
          '<span>' + (r.giftSinMonto
            ? 'Sin importe cargado en la planilla.'
            : 'Cada una sin usar es un lugar que alguien va a ocupar.') + '</span></div>' +
        '</div></div>' +
        sinUsar.map(function (g) {
          return '<div class="persona"><div class="quien">' +
            '<div class="nom">' + esc(g.nombre || '(sin nombre)') + '</div>' +
            '<div class="sub">' + esc([g.deQuien ? 'de ' + g.deQuien : '', g.estado].filter(Boolean).join(' · ')) + '</div></div>' +
            '<span style="font-weight:600">' + (g.monto ? plata(g.monto) : '') + '</span></div>';
        }).join('');
    }

    html += '<div class="seccion">Tikzet</div>' +
      '<div class="tarjeta"><div style="padding:14px">' +
        '<div class="cifra"><span class="grande">' + t.entradas + '</span>' +
        '<span class="de">' + (t.entradas === 1 ? 'entrada' : 'entradas') + '</span>' +
        '<span class="quedan"><b>' + plata(t.recaudado) + '</b>cobrado</span></div>' +
        '<div class="pie">' + (t.sinMonto
          ? '<span style="color:var(--rojo)"><b>' + t.sinMonto + '</b> sin el monto cargado</span>'
          : '<span>Todas con su monto cargado</span>') +
          '<span>Se carga a mano: cruzalo contra el panel de Tikzet.</span></div>' +
      '</div></div>' +
      t.porEdicion.map(function (x) {
        return '<div class="persona"><div class="quien">' +
          '<div class="nom">' + esc(x.titulo + ' · ' + (x.subtitulo || '')) + '</div>' +
          '<div class="sub">' + x.entradas + ' ' + (x.entradas === 1 ? 'entrada' : 'entradas') +
          (x.sinMonto ? ' · ' + x.sinMonto + ' sin monto' : '') + '</div></div>' +
          '<span style="font-weight:600">' + plata(x.recaudado) + '</span></div>';
      }).join('') +
      (t.historico.entradas
        ? '<div class="sub" style="font-size:13px;color:var(--tenue);padding:10px 0">' +
          'En ediciones que ya pasaron: ' + t.historico.entradas + ' entradas más, ' +
          plata(t.historico.recaudado) + '.</div>'
        : '');
    return html;
  }

  /* ---------- gente ---------- */
  function vistaGente(filtro) {
    var todas = [];
    DATOS.ediciones.forEach(function (e) {
      e.personas.forEach(function (p) { todas.push({ e: e, p: p }); });
    });
    todas.sort(function (a, b) {
      if (a.e.vigente !== b.e.vigente) return a.e.vigente ? -1 : 1;
      return (a.p.nombre || '').localeCompare(b.p.nombre || '', 'es');
    });

    var q = (filtro || '').trim();
    var lista = q ? todas.filter(function (x) {
      return coincideBusqueda(
        (x.p.nombre || '') + ' ' + (x.p.email || '') + ' ' + (x.p.celular || '') + ' ' + x.e.edicion,
        x.p.celular, q);
    }) : todas;

    return '<div class="seccion">' + lista.length + ' de ' + todas.length + '</div>' +
      (lista.length ? lista.map(function (x) {
        var etiqueta = ETIQUETAS[x.p.estadoPago] + (x.p.estadoPago === 'parcial' ? ' ' + plata(x.p.saldo) : '');
        return '<div class="persona"><div class="quien">' +
          '<div class="nom">' + esc(x.p.nombre || '(sin nombre)') + '</div>' +
          '<div class="sub">' + esc(x.e.titulo + ' · ' + (x.e.subtitulo || x.e.edicion) +
            (x.e.vigente ? '' : ' · ya pasó')) + '</div></div>' +
          '<span class="chip ' + x.p.estadoPago + '">' + esc(etiqueta) + '</span></div>';
      }).join('') : '<div class="vacio">No hay nadie con eso.</div>');
  }

  /* ---------- alertas ---------- */
  function vistaAlertas() {
    if (!DATOS.alertas.length) {
      return '<div class="vacio">No hay nada para revisar.<br>Los cupos, los pagos y Tikzet cierran.</div>';
    }
    return DATOS.alertas.map(aviso).join('');
  }
  function aviso(a) {
    return '<div class="aviso ' + a.nivel + '"><div class="q">' + esc(a.texto) + '</div>' +
      '<div class="p">' + esc(a.detalle) + '</div></div>';
  }

  /**
   * La misma alerta, para la portada: sin el detalle cuando habla de plata.
   * En Cupos no se muestran montos — el detalle completo está en Alertas.
   */
  function avisoSinPlata(a) {
    // El servidor marca cada alerta con conPlata, pero la página y el Apps
    // Script se despliegan por separado: si el servidor todavía es más viejo,
    // esa marca no viene y hay que sacarla acá. Sin esto, una alerta con
    // montos se colaría en la portada justo mientras falta desplegar.
    var habla = ('conPlata' in a) ? a.conPlata : /\$/.test((a.texto || '') + ' ' + (a.detalle || ''));
    if (!habla) return aviso(a);
    return '<div class="aviso ' + a.nivel + '"><div class="q">' + esc(a.texto) + '</div>' +
      '<div class="p">Los números están en Alertas.</div></div>';
  }

  /* ---------- eventos ---------- */
  document.getElementById('solapas').addEventListener('click', function (ev) {
    var b = ev.target.closest('.solapa');
    if (!b) return;
    SOLAPA = b.dataset.solapa;
    pintarSolapas();
    pintarPanel();
    window.scrollTo(0, 0);
  });

  document.getElementById('panel').addEventListener('click', function (ev) {
    var copiar = ev.target.closest('[data-copiar]');
    if (copiar) {
      var ed = DATOS.ediciones.filter(function (x) { return x.id === copiar.dataset.copiar; })[0];
      if (ed) copiarLista(ed, copiar);
      return;
    }

    var quien = ev.target.closest('[data-quien]');
    if (quien) {
      CONTACTOS[quien.dataset.quien] = !CONTACTOS[quien.dataset.quien];
      pintarPanel();
      return;
    }

    var b = ev.target.closest('.cabeza');
    if (!b) return;
    ABIERTAS[b.dataset.ed] = !ABIERTAS[b.dataset.ed];
    pintarPanel();
  });

  /**
   * Para pasar la lista al grupo o a la cocina: SOLO los nombres.
   * Antes copiaba también el estado de pago ("Mengano — Debe $ 9.200"), así que
   * pegar eso en un grupo contaba quién debe y cuánto. Eso se mira adentro de
   * la app, no se reparte.
   */
  function copiarLista(ed, boton) {
    var texto = (ed.titulo + ' — ' + (ed.subtitulo || '') + '\n' +
      ed.anotados + ' de ' + ed.cupo + '\n\n' +
      ed.personas.map(function (p, i) {
        return (i + 1) + '. ' + (p.nombre || '(sin nombre)');
      }).join('\n')).trim();

    var listo = function () {
      boton.textContent = 'Copiada ✓';
      setTimeout(function () { boton.textContent = 'Copiar la lista de anotados'; }, 2000);
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(listo, function () { copiarAlaVieja(texto, listo); });
    } else {
      copiarAlaVieja(texto, listo);
    }
  }

  // Safari en iOS no siempre deja usar el portapapeles moderno.
  function copiarAlaVieja(texto, listo) {
    var t = document.createElement('textarea');
    t.value = texto;
    t.style.position = 'fixed';
    t.style.opacity = '0';
    document.body.appendChild(t);
    t.select();
    try { document.execCommand('copy'); listo(); } catch (e) {}
    document.body.removeChild(t);
  }

  document.getElementById('btnSalir').addEventListener('click', function () {
    if (!window.confirm('¿Salir y borrar del teléfono el PIN y los datos guardados?')) return;
    olvidarTodo();
    mostrarPuerta('');
  });

  document.getElementById('btnRefrescar').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    btn.textContent = 'Buscando…';
    document.getElementById('error').classList.add('oculto');
    pedirDatos(pinGuardado(), function (nuevo) {
      recibirEstado(nuevo, pinGuardado());
      btn.disabled = false;
      btn.textContent = 'Actualizar';
      pintarTodo();
    }, function (e) {
      btn.disabled = false;
      btn.textContent = 'Actualizar';
      var mensaje = (e && e.message) ? e.message : String(e);
      if (/PIN/i.test(mensaje)) { olvidarPin(); mostrarPuerta(mensaje); return; }
      var caja = document.getElementById('error');
      caja.textContent = 'No se pudo leer la planilla: ' + mensaje;
      caja.classList.remove('oculto');
    });
  });

  arrancar();
</script>

  </body>
</html>
